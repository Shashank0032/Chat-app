version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql://postgres:postgres@db:5432/chatdb
    depends_on:
      - redis
      - db
    volumes:
      # Make sure the folder is named "static" in your repo
      - ./backend/static:/app/static

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # auto-init the schema on first run
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

volumes:
  pgdata:
